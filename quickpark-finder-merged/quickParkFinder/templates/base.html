<main class="content">
    <header>
        {% block header %}{% endblock %}
    </header>

    {% for message in get_flashed_messages() %}
        <div class="flash">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
</main>

{% if g.user %}
<script src="{{ url_for('static', filename='inactivity.js') }}"></script>
{% endif %}
