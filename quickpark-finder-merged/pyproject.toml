[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quickpark-finder"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0",
    "cryptography>=42",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
